[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eq-reference-mcp"
version = "0.1.0"
description = "MCP server for searching, browsing, solving, and interpolating engineering equations and reference tables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Joshua Bryson" },
]
keywords = ["mcp", "engineering", "equations", "thermodynamics", "fluids", "solver"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "sympy>=1.12",
    "scipy>=1.11",
    "pint>=0.23",
]

[project.scripts]
eq-reference-mcp = "eq_reference.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eq_reference"]

[tool.hatch.build.targets.wheel.force-include]
"src/eq_reference/data/equations.sqlite" = "eq_reference/data/equations.sqlite"
"src/eq_reference/data/tables.sqlite" = "eq_reference/data/tables.sqlite"

[tool.pytest.ini_options]
testpaths = ["tests"]
